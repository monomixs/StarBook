<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sliding Navigation</title>
  <style>
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --speed-mult: 1;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f5f6fb;
      color: #23283b;
    }

  * {
      -webkit-tap-highlight-color: transparent;
  }


    .app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Screens */
    .screens { flex: 1; position: relative; overflow: hidden; }

    .track {
      display: flex;
      width: 300%;
      height: 100%;
      transform: translateX(0%);
      transition: transform calc(0.55s / var(--speed-mult)) var(--spring);
    }

    .screen {
      width: 33.3333%;
      flex-shrink: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 32px;
      opacity: 0.4;
      transform: scale(0.94);
      transition: opacity calc(0.5s / var(--speed-mult)) ease, transform calc(0.5s / var(--speed-mult)) var(--spring);
    }

    .screen.is-active { opacity: 1; transform: scale(1); }

    .screen-icon { width: 44px; height: 44px; color: #8891ac; }
    .screen-icon svg { width: 100%; height: 100%; stroke: currentColor; display: block; }

    .screen h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
    .screen p { font-size: 14px; color: #767f98; margin: 0; }

    /* Nav bar */
    .navbar {
      position: relative;
      display: flex;
      margin: 20px;
      padding: 6px;
      background: #e7e9fb;
      border-radius: 999px;
      box-shadow: 0 8px 20px -10px rgba(35, 40, 80, 0.25);
    }

    .pill {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 0;
      width: 108px;
      background: #a9c3f7;
      border-radius: 999px;
      transition: transform calc(0.5s / var(--speed-mult)) var(--spring);
    }

    .nav-item {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-item:focus-visible {
      outline: 2px solid #2e4066;
      outline-offset: 2px;
      border-radius: 16px;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      color: #616e8c;
      flex-shrink: 0;
      transition: color calc(0.3s / var(--speed-mult)) ease;
    }
    .nav-icon svg { width: 100%; height: 100%; stroke: currentColor; display: block; }

    .nav-label {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      margin-left: 0;
      font-size: 13px;
      font-weight: 700;
      color: #2e4066;
      display: inline-block;
      transform-origin: center left;
    }

    .nav-item.is-active .nav-icon { color: #2e4066; }

    /* Animation Presets Base States */
    .anim-fade .nav-label { transition: opacity calc(0.35s / var(--speed-mult)) ease; }
    .anim-fade.is-active .nav-label { max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-slide .nav-label { transition: max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring); }
    .anim-slide.is-active .nav-label { max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-scale .nav-label {
      transform: scale(0.5);
      transition: transform calc(0.35s / var(--speed-mult)) var(--spring), opacity calc(0.25s / var(--speed-mult)) ease, max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-scale.is-active .nav-label { transform: scale(1); max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-fade-slide .nav-label {
      transition: max-width calc(0.35s / var(--speed-mult)) var(--spring), opacity calc(0.25s / var(--speed-mult)) ease, margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-fade-slide.is-active .nav-label { max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-rotate .nav-label {
      transform: rotate(-180deg) scale(0.2);
      transition: transform calc(0.4s / var(--speed-mult)) var(--spring), opacity calc(0.3s / var(--speed-mult)) ease, max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-rotate.is-active .nav-label { transform: rotate(0deg) scale(1); max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-flip .nav-label {
      transform: rotateX(90deg);
      transition: transform calc(0.4s / var(--speed-mult)) var(--spring), opacity calc(0.25s / var(--speed-mult)) ease, max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-flip.is-active .nav-label { transform: rotateX(0deg); max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-blur .nav-label {
      filter: blur(8px);
      transition: filter calc(0.35s / var(--speed-mult)) ease, opacity calc(0.3s / var(--speed-mult)) ease, max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-blur.is-active .nav-label { filter: blur(0px); max-width: 80px; opacity: 1; margin-left: 6px; }

    .anim-pop .nav-label {
      transform: scale(1.4);
      transition: transform calc(0.35s / var(--speed-mult)) var(--spring), opacity calc(0.2s / var(--speed-mult)) ease, max-width calc(0.35s / var(--speed-mult)) var(--spring), margin-left calc(0.35s / var(--speed-mult)) var(--spring);
    }
    .anim-pop.is-active .nav-label { transform: scale(1); max-width: 80px; opacity: 1; margin-left: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .track, .screen, .pill, .nav-label { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<button id="settingsBtn" style="position:fixed;top:12px;right:12px;z-index:1000">⚙️</button>
<div id="panel" style="display:none;position:fixed;top:50px;right:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:1000;font:14px sans-serif">
  <div>Speed <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1"></div>
  <div>Bounce <input id="bounce" type="range" min="0" max="2" step="0.1" value="1"></div>
  <div>Label
    <select id="labelAnim">
      <option value="fade">Fade</option>
      <option value="slide">Slide</option>
      <option value="scale">Scale</option>
      <option value="fade-slide" selected>Fade + Slide</option>
      <option value="rotate">Rotate</option>
      <option value="flip">Flip 3D</option>
      <option value="blur">Blur</option>
      <option value="pop">Pop</option>
    </select>
  </div>
</div>

<div class="app">
  <div class="screens">
    <div class="track" id="track">

      <section class="screen is-active" data-screen="home">
          <span class="screen-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
          </span>
        <h1>Home</h1>
        <p>Your personalized feed</p>
      </section>

      <section class="screen" data-screen="search">
          <span class="screen-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
          </span>
        <h1>Search</h1>
        <p>Find anything, fast</p>
      </section>

      <section class="screen" data-screen="library">
          <span class="screen-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/></svg>
          </span>
        <h1>Library</h1>
        <p>Everything you've saved</p>
      </section>

    </div>
  </div>

  <nav class="navbar" id="navbar">
    <div class="pill" id="pill"></div>

    <button class="nav-item is-active" data-screen="home" aria-current="page">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
      <span class="nav-label">Home</span>
    </button>

    <button class="nav-item" data-screen="search" aria-current="false">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
        </span>
      <span class="nav-label">Search</span>
    </button>

    <button class="nav-item" data-screen="library" aria-current="false">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/></svg>
        </span>
      <span class="nav-label">Library</span>
    </button>
  </nav>
</div>

<script>
  const PILL_WIDTH = 108;
  const track = document.getElementById('track');
  const navbar = document.getElementById('navbar');
  const pill = document.getElementById('pill');
  const navItems = Array.from(document.querySelectorAll('.nav-item'));
  const screenEls = Array.from(document.querySelectorAll('.screen'));
  const root = document.documentElement;
  let current = 0;

  function movePill(index) {
    const btn = navItems[index];
    const navRect = navbar.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    const center = btnRect.left - navRect.left + btnRect.width / 2;
    pill.style.transform = `translateX(${center - PILL_WIDTH / 2}px)`;
  }

  function goTo(index) {
    current = index;
    track.style.transform = `translateX(-${index * 33.3333}%)`;

    screenEls.forEach((el, i) => el.classList.toggle('is-active', i === index));
    navItems.forEach((btn, i) => {
      const active = i === index;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-current', active ? 'page' : 'false');
    });

    movePill(index);
  }

  function updatePresetClass(animType) {
    navItems.forEach(item => {
      item.classList.forEach(className => {
        if (className.startsWith('anim-')) {
          item.classList.remove(className);
        }
      });
      item.classList.add(`anim-${animType}`);
    });
  }

  navItems.forEach((btn, i) => {
    btn.addEventListener('click', () => { if (i !== current) goTo(i); });
  });

  window.addEventListener('resize', () => movePill(current));
  window.addEventListener('load', () => {
    pill.style.transition = 'none';
    movePill(0);
    void pill.offsetWidth;
    pill.style.transition = '';
    updatePresetClass(labelAnim.value);
  });

  const panel = document.getElementById('panel');
  settingsBtn.onclick = () => panel.style.display = panel.style.display === 'block' ? 'none' : 'block';

  speed.oninput = e => {
    root.style.setProperty('--speed-mult', parseFloat(e.target.value));
  };

  bounce.oninput = e => {
    const v = parseFloat(e.target.value);
    root.style.setProperty('--spring', `cubic-bezier(0.34,${1 + 0.56 * v},0.64,1)`);
  };

  labelAnim.onchange = e => {
    updatePresetClass(e.target.value);
  };
</script>
</body>
</html>
